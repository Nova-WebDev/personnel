services:
  redis:
    image: redis:7-alpine
    container_name: personnel_redis
    command: >
      redis-server
      --appendonly no
      --save ""
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    networks:
      - personnel_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: personnel_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: personnel
    networks:
      - personnel_net
    restart: unless-stopped
    volumes:
      - personnel_pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: personnel_backend
    networks:
      - personnel_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+asyncpg://admin:admin123@postgres:5432/personnel"
      REDIS_URL: "redis://redis:6379/0"
      SMS_API_KEY: "57616e313261555a53386e2f5745335a52703043424f6650364649597754314e325766724757574a6d77493d"
      SMS_TEMPLATE: "login"
      STORAGE_PATH: "/app/media"
      FRONTEND_DOMAIN: "http://personnel.hoomanholding.co/card"
      PERSONNEL_API_KEY: "649050f5d9f6b53e6f10c4ae2516e55f010c7dc878dc4ede4dd7b687d40393a0"
    restart: unless-stopped
    volumes:
      - personnel_media:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: personnel_nginx
    networks:
      - personnel_net
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
networks:
  personnel_net:
    driver: bridge
volumes:
  personnel_pg_data:
  personnel_media:
