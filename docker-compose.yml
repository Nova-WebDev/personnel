x-cron-key: &cron_key "3f9a7c1e5b2d84a06e7f1c93d5b8a2e4170c6f9d3a85b1e2c4d7f08a9b36e5c1"
x-event-channel: &event_channel "events"

services:
  redis:
    image: redis:7-alpine
    container_name: personnel_redis
    command: >
      redis-server
      --appendonly no
      --save ""
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    networks:
      - personnel_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: personnel_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: personnel
    networks:
      - personnel_net
    restart: unless-stopped
    volumes:
      - personnel_pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: personnel_backend
    networks:
      - personnel_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+asyncpg://admin:admin123@postgres:5432/personnel"
      REDIS_URL: "redis://redis:6379/0"
      SMS_API_KEY: "57616e313261555a53386e2f5745335a52703043424f6650364649597754314e325766724757574a6d77493d"
      SMS_TEMPLATE: "login"
      STORAGE_PATH: "/app/media"
      FRONTEND_DOMAIN: "https://personnel.hoomanholding.co/card"
      PERSONNEL_API_KEY: "649050f5d9f6b53e6f10c4ae2516e55f010c7dc878dc4ede4dd7b687d40393a0"
      CRON_API_KEY: *cron_key
      EVENT_CHANNEL: *event_channel
    restart: unless-stopped
    volumes:
      - personnel_media:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/app/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  cron:
    build:
      context: ./cron
      dockerfile: Dockerfile
    container_name: personnel_cron
    networks:
      - personnel_net
    depends_on:
      backend:
        condition: service_healthy
    environment:
      CRON_API_KEY: *cron_key
    restart: unless-stopped

  sse-gateway:
    build:
      context: ./sse-gateway
      dockerfile: Dockerfile
    container_name: personnel_sse_gateway
    networks:
      - personnel_net
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: "redis://redis:6379/0"
      EVENT_CHANNEL: *event_channel
    restart: unless-stopped
    stop_grace_period: 20s
    volumes:
      - ./sse-gateway/key:/app/key:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: personnel_nginx
    networks:
      - personnel_net
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
      sse-gateway:
        condition: service_healthy
    restart: unless-stopped

networks:
  personnel_net:
    driver: bridge

volumes:
  personnel_pg_data:
  personnel_media:
